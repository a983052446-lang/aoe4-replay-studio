name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    # 工具依赖注册表 / tasklist / Steam 命令行，只在 Windows 上有意义。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法编译
        run: python -m compileall -q aoereplay native run.py tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONIOENCODING: utf-8

      - name: 模块导入
        run: python -c "import aoereplay, aoereplay.server, aoereplay.config, aoereplay.downloads, aoereplay.library, aoereplay.actor, aoereplay.recorder, aoereplay.mimic, aoereplay.custom, aoereplay.relay, aoereplay.replay_watch, aoereplay.launcher; print('import ok', aoereplay.__version__)"
        env:
          PYTHONIOENCODING: utf-8

      - name: 冒烟测试（不装第三方包，纯标准库）
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8

  stdlib-only:
    # README 承诺「缺可选包也能跑」—— 这里把这条承诺变成 CI 的一部分。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 纯标准库下跑一遍
        run: |
          python -c "import importlib.util as u; print('requests:', bool(u.find_spec('requests')), '| websockets:', bool(u.find_spec('websockets')))"
          python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
